services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: burn_calories_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d burn_calories_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test-backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@test-db:5432/burn_calories_test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      API_BASE_URL: http://test-backend:8000
      TEST_DATABASE_URL: postgresql://postgres:postgres@test-db:5432/burn_calories_test
    depends_on:
      test-backend:
        condition: service_healthy
    command:
      [
        "pytest",
        "-q",
        "--log-cli-level=INFO",
        "--log-cli-format=%(asctime)s | %(levelname)s | %(name)s | %(message)s",
        "tests/integration",
      ]
